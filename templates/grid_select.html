<!DOCTYPE html>
<html>
<head>
    <title>Memory AI Game - Select Grid</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #0f0f1a;
            font-family: 'Press Start 2P', cursive;
            text-align: center;
            color: #00ffcc;
            padding-top: 60px;
            padding-bottom: 40px;
        }

        h1 {
            font-size: 28px;
            text-shadow: 4px 4px #ff00ff;
            margin-bottom: 40px;
        }

        h2 {
            font-size: 16px;
            color: #ffff00;
            text-shadow: 2px 2px #ff00ff;
            margin-bottom: 40px;
        }

        .grid-options {
            display: grid;
            grid-template-columns: repeat(2, 150px);
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
        }

        .grid-btn {
            padding: 20px;
            font-size: 14px;
            background-color: #ff00ff;
            color: black;
            text-decoration: none;
            border: 4px solid #00ffcc;
            box-shadow: 6px 6px #00ffcc;
            display: inline-block;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
        }

        .grid-btn:hover {
            transform: translate(-3px, -3px);
            box-shadow: 8px 8px #ffff00;
            background-color: #00ffcc;
        }

        .difficulty-label {
            font-size: 12px;
            color: #aaffdd;
            margin-top: 40px;
        }

        .back-link {
            display: inline-block;
            margin-top: 40px;
            padding: 10px 20px;
            font-size: 10px;
            background-color: #333;
            color: #00ffcc;
            text-decoration: none;
            border: 2px solid #00ffcc;
        }

        .back-link:hover {
            background-color: #444;
        }
    </style>
</head>

<body>

<h1>MEMORY AI GAME</h1>

<h2>SELECT GRID SIZE</h2>

<div class="difficulty-label">
    Difficulty: {{ difficulty|upper }}
</div>

<div class="grid-options">
    <a class="grid-btn" href="{{ url_for('start_game_with_grid', level=difficulty, grid_rows=3, grid_cols=4) }}">3x4</a>
    <a class="grid-btn" href="{{ url_for('start_game_with_grid', level=difficulty, grid_rows=4, grid_cols=4) }}">4x4</a>
    <a class="grid-btn" href="{{ url_for('start_game_with_grid', level=difficulty, grid_rows=4, grid_cols=5) }}">4x5</a>
    <a class="grid-btn" href="{{ url_for('start_game_with_grid', level=difficulty, grid_rows=5, grid_cols=6) }}">5x6</a>
</div>

<a class="back-link" href="{{ url_for('home') }}">BACK TO HOME</a>

</body>
</html>
